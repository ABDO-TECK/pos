name: POS Update Engine Release Verification

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'version.json'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify, such as v0.0.4
        required: true
        type: string
      from_ref:
        description: Full 40-character immutable baseline commit SHA used for a Delta
        required: true
        type: string
      from_version:
        description: Baseline application version used for a Delta
        required: true
        type: string
      delta_scope:
        description: Deployable Delta scope; Electron/package versions remain at the baseline
        required: true
        default: backend
        type: choice
        options:
          - backend
          - frontend
          - mixed
      release_channel:
        description: Expected GitHub publication channel
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable

permissions:
  contents: read

jobs:
  automation-verification:
    name: Validate release automation without building a release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out workflow and release automation
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run release automation regression tests
        run: npm run test:release-workflow

  verify-release-build:
    name: Build and verify release without publishing
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      BASELINE_REF: ${{ inputs.from_ref }}
      BASELINE_VERSION: ${{ inputs.from_version }}
      DELTA_SCOPE: ${{ inputs.delta_scope }}
      RELEASE_CHANNEL: ${{ inputs.release_channel }}
    steps:
      - name: Check out the exact requested tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, gd, mbstring, dom, xml, xmlwriter, zip, openssl
          coverage: none

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          composer install --working-dir=backend --no-interaction --prefer-dist --no-progress

      - name: Validate tag, runtime, and immutable Delta baseline
        run: |
          node scripts/validate-release-source.mjs \
            --mode delta \
            --root . \
            --tag "$RELEASE_TAG" \
            --baseline-ref "$BASELINE_REF" \
            --baseline-version "$BASELINE_VERSION" \
            --delta-scope "$DELTA_SCOPE" \
            --release-channel "$RELEASE_CHANNEL"

      - name: Run release unit tests
        run: |
          php backend/vendor/bin/phpunit --configuration backend/phpunit.xml \
            backend/tests/Unit/UpdateControllerTest.php \
            backend/tests/Unit/GitHubReleaseProviderTest.php \
            backend/tests/Unit/ManifestSignatureServiceTest.php \
            backend/tests/Unit/DeltaUpdateServiceTest.php \
            backend/tests/Unit/UpdateManifestServiceTest.php \
            backend/tests/Unit/UpdateServiceTest.php
          node --test scripts/release-workflow.test.mjs

      - name: Build frontend and backend artifacts
        run: |
          npm --prefix frontend run build
          npm run build:phar

      - name: Require the authorized manifest-signing secret
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATE_PRIVATE_KEY" ]; then
            echo '::error::UPDATE_PRIVATE_KEY is not configured; refusing to build a release package.'
            exit 1
          fi

      - name: Build signed package from the explicit baseline
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          CLEAN_VERSION="${RELEASE_TAG#v}"
          CLEAN_VERSION="${CLEAN_VERSION%%-*}"
          php scripts/build-release-package.php \
            --tag "$RELEASE_TAG" \
            --from-ref "$BASELINE_REF" \
            --from-version "$BASELINE_VERSION" \
            --output-dir "release/$CLEAN_VERSION"

      - name: Verify signed manifest, hashes, ZIP contents, and assets
        run: |
          CLEAN_VERSION="${RELEASE_TAG#v}"
          CLEAN_VERSION="${CLEAN_VERSION%%-*}"
          php scripts/verify-release-package.php \
            --release-dir "release/$CLEAN_VERSION" \
            --target-version "$CLEAN_VERSION" \
            --minimum-version "$BASELINE_VERSION"
