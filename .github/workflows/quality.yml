name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pos
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP with MySQL PDO
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, gd, mbstring, dom, xml, xmlwriter, zip
          coverage: none

      - name: Install root dependencies from lockfile
        run: npm ci

      - name: Install frontend dependencies from lockfile
        run: npm --prefix frontend ci

      - name: Install backend dependencies from lockfile
        run: composer install --working-dir=backend --no-interaction --prefer-dist --no-progress

      - name: Run repository quality gates including disposable-MySQL migrations and concurrency
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_NAME: pos
          DB_USER: root
          DB_PASS: root
        run: node scripts/quality.mjs --skip-install --require-mysql
