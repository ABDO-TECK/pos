name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example v1.1.44)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,openssl,phar,sqlite3
          coverage: none

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Build backend PHAR
        run: npm run build:phar

      - name: Prepare pinned portable PHP and MariaDB runtimes
        run: npm run prepare:desktop-runtime

      - name: Verify portable runtime before packaging
        run: npm run verify:desktop-runtime

      - name: Require production Windows signing configuration
        env:
          CSC_LINK: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/require-production-signing.mjs

      - name: Build Windows installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - name: Verify packaged runtime contents
        run: node scripts/verify-desktop-runtime.mjs --root dist-electron/win-unpacked/resources/portable --strict

      - name: Verify final signed installer and updater metadata
        shell: pwsh
        env:
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
        run: ./scripts/verify-desktop-release.ps1 -ReleaseDirectory dist-electron -Tag '${{ inputs.tag }}' -RequireAuthenticode -ExpectedPublisher $env:WINDOWS_SIGNING_PUBLISHER

      - name: Upload verified release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $installer = "dist-electron/POS-Desktop-Setup-$version.exe"
          $blockmap = "$installer.blockmap"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not created: $installer"
          }
          if (-not (Test-Path -LiteralPath $blockmap)) {
            throw "Blockmap was not created: $blockmap"
          }
          gh release upload $env:RELEASE_TAG $installer $blockmap dist-electron/latest.yml --repo $env:REPOSITORY --clobber
