name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version-matched release tag to verify and upload
        required: true
        type: string
      release_channel:
        description: Expected channel of the existing GitHub release
        required: true
        default: stable
        type: choice
        options:
          - prerelease
          - stable
      confirm_publish:
        description: Confirm that verified desktop assets may be uploaded
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  confirm-publish:
    name: Require explicit desktop publication confirmation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
    steps:
      - name: Refuse an unconfirmed upload
        run: |
          if [ "$CONFIRM_PUBLISH" != 'true' ]; then
            echo '::error::confirm_publish must be true; no desktop assets will be uploaded.'
            exit 1
          fi

  resolve-release-source:
    name: Resolve immutable desktop release tag
    needs: confirm-publish
    if: ${{ needs.confirm-publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve fully qualified tag to a commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo '::error::The release tag must be a version-matched vX.Y.Z tag.'
            exit 1
          fi

          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")" || {
            echo '::error::The requested release tag does not exist.'
            exit 1
          }
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          case "$object_type" in
            commit)
              release_sha="$object_sha"
              ;;
            tag)
              tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")" || {
                echo '::error::The annotated release tag target could not be resolved.'
                exit 1
              }
              target_type="$(jq -r '.object.type' <<<"$tag_json")"
              if [ "$target_type" != 'commit' ]; then
                echo '::error::The annotated release tag does not target a commit.'
                exit 1
              fi
              release_sha="$(jq -r '.object.sha' <<<"$tag_json")"
              ;;
            *)
              echo "::error::Unsupported release tag object type: $object_type"
              exit 1
              ;;
          esac

          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::The release tag did not resolve to a full commit SHA.'
            exit 1
          fi

          echo "release_ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Workflow definition revision: $GITHUB_SHA"
          echo "Release source commit: $release_sha"

  release:
    needs: [confirm-publish, resolve-release-source]
    if: ${{ needs.resolve-release-source.result == 'success' }}
    runs-on: windows-latest
    environment:
      name: github-release-approval
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_REF: ${{ needs.resolve-release-source.outputs.release_ref }}
      EXPECTED_RELEASE_SHA: ${{ needs.resolve-release-source.outputs.release_sha }}
      RELEASE_CHANNEL: ${{ inputs.release_channel }}
      WORKFLOW_REVISION: ${{ github.sha }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release-source.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,openssl,phar,sqlite3
          coverage: none

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Validate full desktop source and release channel
        shell: pwsh
        run: node scripts/validate-release-source.mjs --mode full --root . --tag $env:RELEASE_TAG --expected-commit $env:EXPECTED_RELEASE_SHA --release-channel $env:RELEASE_CHANNEL

      - name: Build frontend
        run: npm run frontend:build

      - name: Build backend PHAR
        run: npm run build:phar

      - name: Prepare pinned portable PHP and MariaDB runtimes
        run: npm run prepare:desktop-runtime

      - name: Verify portable runtime before packaging
        run: npm run verify:desktop-runtime

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - name: Verify packaged runtime contents
        run: node scripts/verify-desktop-runtime.mjs --root dist-electron/win-unpacked/resources/portable --strict

      - name: Verify unsigned installer and updater metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/verify-desktop-release.ps1 -ReleaseDirectory dist-electron -Tag $env:RELEASE_TAG

      - name: Verify release tag has not changed since source resolution
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_RELEASE_SHA: ${{ needs.resolve-release-source.outputs.release_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ref = gh api "repos/$env:REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          $target = $ref.object
          if ($target.type -eq 'tag') {
            $target = gh api "repos/$env:REPOSITORY/git/tags/$($target.sha)" | ConvertFrom-Json | Select-Object -ExpandProperty object
          }
          if ($target.type -ne 'commit' -or $target.sha -ne $env:EXPECTED_RELEASE_SHA) {
            throw "Release tag $env:RELEASE_TAG no longer resolves to the approved source commit."
          }
          Write-Host "Verified $env:RELEASE_REF at $($target.sha) for workflow revision $env:GITHUB_SHA."

      - name: Verify the existing GitHub release channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $release = gh api "repos/$env:REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          $expectedPrerelease = $env:RELEASE_CHANNEL -eq 'prerelease'
          if ([bool]$release.prerelease -ne $expectedPrerelease) {
            throw "GitHub release channel mismatch for $env:RELEASE_TAG"
          }

      - name: Refuse existing desktop asset conflicts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $release = gh api "repos/$env:REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          $version = $env:RELEASE_TAG.TrimStart('v') -replace '-.*$', ''
          $expectedAssets = @(
            "POS-Desktop-Setup-$version.exe",
            "POS-Desktop-Setup-$version.exe.blockmap",
            'latest.yml'
          )
          $existingAssets = @($release.assets | ForEach-Object { $_.name })
          $conflicts = @($expectedAssets | Where-Object { $existingAssets -contains $_ })
          if ($conflicts.Count -gt 0) {
            throw "Refusing to overwrite existing desktop assets: $($conflicts -join ', ')"
          }

      - name: Upload verified release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v') -replace '-.*$', ''
          $installer = "dist-electron/POS-Desktop-Setup-$version.exe"
          $blockmap = "$installer.blockmap"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not created: $installer"
          }
          if (-not (Test-Path -LiteralPath $blockmap)) {
            throw "Blockmap was not created: $blockmap"
          }
          gh release upload $env:RELEASE_TAG $installer $blockmap dist-electron/latest.yml --repo $env:REPOSITORY

      - name: Verify uploaded desktop installer SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v') -replace '-.*$', ''
          $installerName = "POS-Desktop-Setup-$version.exe"
          $downloadDirectory = Join-Path $env:RUNNER_TEMP "pos-desktop-upload-check-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:REPOSITORY --pattern $installerName --pattern "$installerName.blockmap" --pattern latest.yml --dir $downloadDirectory
          $localHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist-electron/$installerName").Hash
          $remoteHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $downloadDirectory $installerName)).Hash
          if ($localHash -ne $remoteHash) {
            throw 'Uploaded installer SHA-256 does not match the verified local installer.'
          }
          Write-Host "Uploaded installer SHA-256: $localHash"
